name: Courier publish
on:
  schedule:
    - cron: "*/15 * * * *"   # checks the queue every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only, post nothing"
        default: "false"
concurrency:
  group: courier
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish approved jobs
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          QUINN_IG_USER_ID: ${{ secrets.QUINN_IG_USER_ID }}
          QUINN_IG_ACCESS_TOKEN: ${{ secrets.QUINN_IG_ACCESS_TOKEN }}
          SHAUNAK_IG_USER_ID: ${{ secrets.SHAUNAK_IG_USER_ID }}
          SHAUNAK_IG_ACCESS_TOKEN: ${{ secrets.SHAUNAK_IG_ACCESS_TOKEN }}
          QUINN_X_API_KEY: ${{ secrets.QUINN_X_API_KEY }}
          QUINN_X_API_SECRET: ${{ secrets.QUINN_X_API_SECRET }}
          QUINN_X_ACCESS_TOKEN: ${{ secrets.QUINN_X_ACCESS_TOKEN }}
          QUINN_X_ACCESS_SECRET: ${{ secrets.QUINN_X_ACCESS_SECRET }}
          SHAUNAK_X_API_KEY: ${{ secrets.SHAUNAK_X_API_KEY }}
          SHAUNAK_X_API_SECRET: ${{ secrets.SHAUNAK_X_API_SECRET }}
          SHAUNAK_X_ACCESS_TOKEN: ${{ secrets.SHAUNAK_X_ACCESS_TOKEN }}
          SHAUNAK_X_ACCESS_SECRET: ${{ secrets.SHAUNAK_X_ACCESS_SECRET }}
          SHAUNAK_LI_ACCESS_TOKEN: ${{ secrets.SHAUNAK_LI_ACCESS_TOKEN }}
          SHAUNAK_LI_PERSON_ID: ${{ secrets.SHAUNAK_LI_PERSON_ID }}
        run: python publish.py
      - name: Save ledger and results
        if: always()
        run: |
          git config user.name "courier"
          git config user.email "courier@users.noreply.github.com"
          git add state/ledger.json queue/results.json
          git diff --cached --quiet || (git commit -m "courier: update ledger and results" && git pull --rebase && git push)
